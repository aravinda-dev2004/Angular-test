<div class="card" style="width: 18rem;">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQdN7FlZR9ZpY_EETzEq4f38wgvGxhATfDfsA&s" class="card-img-top" alt="...">
  <div class="card-body">
    <h5 class="card-title">Card title</h5>
    <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s content.</p>
    <input type="button" class="btn btn-primary" value="click" (click)="clickMe()">
  </div>
</div>

<input type="text" [(ngModel)]="customers.name" placeholder="Enter your name" class="text-body-secondary">
<input type="text" [(ngModel)]="customers.age" placeholder="Enter your age">
<input type="text" [(ngModel)]="customers.address" placeholder="Enter your address">

<p>Name: {{ customers.name }}</p>
<p>Age: {{ customers.age }}</p>
<p>Address: {{ customers.address }}</p>
